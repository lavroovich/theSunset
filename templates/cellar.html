<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Винная карта</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

    <style>
        :root {
            --bg: #faf7f0;
            --surface: #fffdfa;
            --surface-soft: #f5eee6;

            --text: #302724;
            --muted: #6f625b;

            --wine: #7f1212;
            --wine-dark: #570a0d;
            --wine-soft: #f3e3e0;

            --gold-soft: #f5edd9;
            --gold-text: #6d5517;

            --border: rgba(127, 18, 18, 0.14);

            --shadow:
                0 16px 42px rgba(73, 43, 33, 0.08);

            --radius-large: 26px;
            --radius-medium: 18px;
        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Manrope", sans-serif;
            font-size: 17px;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 12% 0%,
                    rgba(127, 18, 18, 0.055),
                    transparent 34rem
                ),
                linear-gradient(
                    180deg,
                    #faf7f0 0%,
                    #fffaf5 45%,
                    #f8f2ea 100%
                );
        }


        button,
        input {
            font: inherit;
        }


        button {
            color: inherit;
        }


        main {
            width: min(1160px, calc(100% - 40px));

            margin: 0 auto;

            padding: 64px 0 80px;
        }


        /* =========================================
           HERO
        ========================================== */

        .hero {
            margin-bottom: 46px;
        }


        .hero-copy {
            max-width: 760px;
        }


        /*
         * TODO:
         * здесь потом будет нормальное лого
         */

        .hero-kicker {
            margin: 0 0 12px;

            font-family: "Literata", serif;

            color: var(--wine);

            font-size: 1rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.12em;
        }


        .hero h1 {
            margin: 0;

            font-family: "Literata", serif;

            color: var(--wine-dark);

            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 600;

            line-height: 0.92;
            letter-spacing: -0.025em;
        }


        .hero-description {
            max-width: 620px;

            margin: 24px 0 0;

            color: var(--muted);

            font-size: 1.05rem;
            line-height: 1.65;
        }


        /* =========================================
           BUTTONS
        ========================================== */

        .button {
            min-height: 52px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 0 22px;

            border: 0;
            border-radius: 15px;

            cursor: pointer;

            font-size: 1rem;
            font-weight: 700;

            transition:
                transform 150ms ease,
                background 150ms ease,
                box-shadow 150ms ease;
        }


        .button:hover {
            transform: translateY(-2px);
        }


        .button-primary {
            background: var(--wine);
            color: white;

            box-shadow:
                0 11px 26px rgba(127, 18, 18, 0.18);
        }


        .button-primary:hover {
            background: var(--wine-dark);
        }


        .button-secondary {
            background: var(--surface);

            border: 1px solid var(--border);

            color: var(--wine-dark);
        }


        /* =========================================
           CATALOG BAR
        ========================================== */

        .catalog-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 18px;

            padding-bottom: 22px;
            margin-bottom: 28px;

            border-bottom: 1px solid var(--border);
        }


        .wine-count {
            color: var(--muted);

            font-size: 1rem;
        }


        .wine-count strong {
            color: var(--text);

            font-size: 1.08rem;
        }


        /* =========================================
           CATALOG GROUPS
        ========================================== */

        .catalog {
            display: flex;
            flex-direction: column;

            gap: 64px;
        }


        .country-group {
            display: flex;
            flex-direction: column;

            gap: 28px;
        }


        .country-heading {
            display: flex;
            align-items: center;

            gap: 18px;
        }


        .country-heading h2 {
            margin: 0;

            flex: 0 0 auto;

            font-family: "Literata", serif;

            color: var(--wine-dark);

            font-size: 2.4rem;
            font-weight: 600;
        }


        .country-heading-line {
            height: 2px;
            flex: 1;

            background:
                linear-gradient(
                    90deg,
                    rgba(127, 18, 18, 0.28),
                    rgba(127, 18, 18, 0.03)
                );
        }


        .country-count {
            flex: 0 0 auto;

            color: var(--muted);

            font-size: 0.85rem;
            font-weight: 600;
        }


        .color-group {
            display: flex;
            flex-direction: column;

            gap: 16px;
        }


        .color-heading {
            display: flex;
            align-items: center;

            gap: 12px;

            color: var(--text);

            font-size: 0.95rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }


        .color-heading::before {
            content: "";

            width: 30px;
            height: 3px;

            flex: 0 0 auto;

            background: var(--wine);

            border-radius: 999px;
        }


        /* =========================================
           GRID
        ========================================== */

        .wine-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 22px;
        }


        /* =========================================
           CARD
        ========================================== */

        .wine-card {
            min-width: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 249, 244, 0.97),
                    rgba(255, 255, 255, 0.99) 58%
                );

            border: 1px solid var(--border);
            border-radius: var(--radius-large);

            box-shadow: var(--shadow);

            transition:
                transform 180ms ease,
                border-color 180ms ease,
                box-shadow 180ms ease;
        }


        .wine-card:hover {
            transform: translateY(-4px);

            border-color:
                rgba(127, 18, 18, 0.28);

            box-shadow:
                0 22px 54px rgba(73, 43, 33, 0.11);
        }


        /* =========================================
           MEDIA
        ========================================== */

        .wine-media {
            position: relative;

            height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 11px 11px 0;

            overflow: hidden;

            border-radius: 20px;

            background:
                radial-gradient(
                    circle at 50% 38%,
                    #fffefa,
                    #eee5db 80%
                );
        }


        .wine-media::after {
            content: "";

            position: absolute;

            bottom: 30px;
            left: 50%;

            width: 170px;
            height: 32px;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                rgba(55, 33, 25, 0.13);

            filter: blur(12px);
        }


        /*
         * TODO:
         * заменить настоящим изображением бутылки
         */

        .fake-bottle {
            position: relative;
            z-index: 2;

            width: 76px;
            height: 205px;

            border-radius:
                18px 18px 13px 13px;

            background:
                linear-gradient(
                    90deg,
                    #271b17,
                    #654c40 48%,
                    #251916
                );

            box-shadow:
                inset 8px 0 11px rgba(255, 255, 255, 0.05),
                0 16px 27px rgba(45, 25, 18, 0.18);
        }


        .fake-bottle::before {
            content: "";

            position: absolute;

            top: -64px;
            left: 22px;

            width: 32px;
            height: 76px;

            border-radius:
                6px 6px 2px 2px;

            background:
                linear-gradient(
                    90deg,
                    #281b18,
                    #634b40,
                    #281b18
                );
        }


        .fake-bottle::after {
            content: "WINE";

            position: absolute;

            top: 68px;
            left: 9px;

            width: 58px;
            height: 76px;

            display: grid;
            place-items: center;

            background: #eee5d8;
            color: var(--wine-dark);

            font-family: "Literata", serif;

            font-size: 0.72rem;
            font-weight: 700;
        }


        /* =========================================
           BODY
        ========================================== */

        .wine-body {
            display: flex;
            flex-direction: column;

            flex: 1;

            padding: 25px 27px 27px;
        }


        .wine-name {
            margin: 0;

            font-family: "Literata", serif;

            color: var(--wine-dark);

            font-size: 2rem;
            font-weight: 600;

            line-height: 1.08;
        }


        /* =========================================
           SPECS
        ========================================== */

        .wine-specs {
            display: flex;
            flex-wrap: wrap;

            gap: 9px;

            margin-top: 18px;
        }


        .wine-spec {
            min-height: 38px;

            display: inline-flex;
            align-items: center;

            gap: 6px;

            padding: 9px 13px;

            border-radius: 999px;

            background: var(--wine-soft);
            color: var(--wine-dark);

            font-size: 0.9rem;
            font-weight: 700;

            line-height: 1;

            white-space: nowrap;
        }


        .wine-spec--sparkling {
            background: var(--gold-soft);
            color: var(--gold-text);
        }


        .wine-spec--glass {
            background: #eee8e1;
            color: #554943;
        }


        /* =========================================
           FACTS
        ========================================== */

        .wine-facts {
            display: flex;
            flex-direction: column;

            gap: 17px;

            margin: 25px 0 27px;
        }


        .wine-fact {
            display: grid;

            grid-template-columns:
                30px 1fr;

            gap: 10px;

            align-items: start;
        }


        .wine-fact-icon {
            width: 30px;
            height: 30px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: var(--wine-soft);
            color: var(--wine);

            font-size: 0.85rem;
            font-weight: 700;
        }


        .wine-fact-content {
            min-width: 0;
        }


        .wine-fact-label {
            display: block;

            margin-bottom: 3px;

            color: var(--muted);

            font-size: 0.78rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.07em;
        }


        .wine-fact-value {
            display: block;

            color: var(--text);

            font-size: 1rem;
            font-weight: 500;

            line-height: 1.5;
        }


        /* =========================================
           PRICE
        ========================================== */

        .wine-footer {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 18px;

            margin-top: auto;

            padding-top: 22px;

            border-top: 1px solid var(--border);
        }


        .prices {
            display: flex;
            flex-wrap: wrap;

            gap: 28px;
        }


        .price-block {
            display: flex;
            flex-direction: column;

            gap: 3px;
        }


        .price-label {
            color: var(--muted);

            font-size: 0.78rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.07em;
        }


        .price-value {
            font-family: "Literata", serif;

            color: var(--wine-dark);

            font-size: 1.8rem;
            font-weight: 700;

            line-height: 1;
        }


        .price-block--glass .price-value {
            font-size: 1.55rem;
        }


        .open-card {
            width: 50px;
            height: 50px;

            flex: 0 0 auto;

            display: grid;
            place-items: center;

            background: var(--wine-soft);
            color: var(--wine-dark);

            border-radius: 50%;

            text-decoration: none;

            font-size: 1.3rem;
            font-weight: 700;

            transition:
                transform 150ms ease,
                background 150ms ease;
        }


        .open-card:hover {
            transform: translateX(3px);

            background: #ead2ce;
        }


        /* =========================================
           STATES
        ========================================== */

        .state-message {
            padding: 64px 28px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius-large);

            color: var(--muted);

            text-align: center;

            font-size: 1.05rem;

            box-shadow: var(--shadow);
        }


        /* =========================================
           FILTERS
        ========================================== */

        .filters-overlay {
            position: fixed;
            z-index: 100;

            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(38, 26, 22, 0.3);

            backdrop-filter: blur(8px);
        }


        .filters-overlay.open {
            display: flex;
        }


        .filters-panel {
            width: min(850px, 100%);
            max-height: calc(100vh - 40px);

            overflow-y: auto;

            padding: 32px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 28px;

            box-shadow:
                0 30px 90px rgba(43, 24, 19, 0.2);
        }


        .filters-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;
        }


        .filters-header h2 {
            margin: 0 0 7px;

            font-family: "Literata", serif;

            color: var(--wine-dark);

            font-size: 2.3rem;
            font-weight: 600;
        }


        .filters-header p {
            margin: 0;

            color: var(--muted);

            font-size: 0.95rem;
        }


        .close-button {
            width: 48px;
            height: 48px;

            flex: 0 0 auto;

            border: 0;
            border-radius: 50%;

            background: var(--surface-soft);

            cursor: pointer;

            font-size: 1.4rem;
        }


        .filters-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 17px;
        }


        .filter-group {
            padding: 20px;

            background: #faf6f1;

            border: 1px solid var(--border);
            border-radius: var(--radius-medium);
        }


        .filter-group.wide {
            grid-column: 1 / -1;
        }


        .filter-title {
            display: block;

            margin-bottom: 13px;

            color: var(--wine-dark);

            font-size: 0.85rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }


        .search-input {
            width: 100%;

            min-height: 52px;

            padding: 13px 16px;

            background: white;

            border: 1px solid var(--border);
            border-radius: 13px;

            color: var(--text);

            font-size: 1rem;

            outline: none;
        }


        .search-input:focus {
            border-color: var(--wine);

            box-shadow:
                0 0 0 4px rgba(127, 18, 18, 0.08);
        }


        .chips {
            display: flex;
            flex-wrap: wrap;

            gap: 9px;
        }


        .chip {
            min-height: 44px;

            padding: 9px 14px;

            background: white;
            color: var(--text);

            border: 1px solid var(--border);
            border-radius: 999px;

            cursor: pointer;

            font-size: 0.9rem;
            font-weight: 600;

            transition:
                background 150ms ease,
                color 150ms ease,
                border-color 150ms ease;
        }


        .chip.active {
            background: var(--wine);
            color: white;

            border-color: var(--wine);
        }


        .checkbox-row {
            min-height: 48px;

            display: flex;
            align-items: center;

            gap: 12px;

            color: var(--text);

            font-size: 1rem;
            font-weight: 600;

            cursor: pointer;
        }


        .checkbox-row input {
            width: 21px;
            height: 21px;

            flex: 0 0 auto;

            accent-color: var(--wine);
        }


        .filter-actions {
            display: flex;
            justify-content: flex-end;

            gap: 11px;

            margin-top: 25px;
        }


        /* =========================================
           FOOTER
        ========================================== */

        footer {
            width: min(1160px, calc(100% - 40px));

            display: flex;
            justify-content: space-between;

            gap: 15px;

            margin: 0 auto;

            padding-bottom: 40px;

            color: var(--muted);

            font-size: 0.8rem;
        }


        footer strong {
            color: var(--wine-dark);
        }


        /* =========================================
           TABLET
        ========================================== */

        @media (max-width: 820px) {
            .wine-grid {
                grid-template-columns: 1fr;
            }


            .wine-media {
                height: 320px;
            }
        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 620px) {
            body {
                font-size: 16px;
            }


            main {
                width: calc(100% - 24px);

                padding-top: 38px;
            }


            .hero {
                margin-bottom: 32px;
            }


            .hero-kicker {
                font-size: 0.9rem;
            }


            .hero h1 {
                font-size: 3.5rem;
            }


            .hero-description {
                font-size: 1rem;
            }


            .catalog-bar {
                align-items: stretch;
                flex-direction: column;

                gap: 14px;
            }


            .catalog-bar .button {
                width: 100%;
            }


            .country-heading {
                gap: 10px;
            }


            .country-heading h2 {
                font-size: 2rem;
            }


            .country-count {
                display: none;
            }


            .wine-media {
                height: 285px;
            }


            .wine-body {
                padding: 23px 21px 24px;
            }


            .wine-name {
                font-size: 1.8rem;
            }


            .wine-spec {
                min-height: 40px;

                font-size: 0.88rem;
            }


            .wine-fact-label {
                font-size: 0.76rem;
            }


            .wine-fact-value {
                font-size: 1rem;
            }


            .prices {
                gap: 22px;
            }


            .price-value {
                font-size: 1.7rem;
            }


            .price-block--glass .price-value {
                font-size: 1.5rem;
            }


            .open-card {
                width: 52px;
                height: 52px;
            }


            .filters-overlay {
                padding: 10px;
            }


            .filters-panel {
                padding: 22px;

                max-height:
                    calc(100vh - 20px);

                border-radius: 23px;
            }


            .filters-grid {
                grid-template-columns: 1fr;
            }


            .filter-group.wide {
                grid-column: auto;
            }


            .filter-actions {
                flex-direction: column-reverse;
            }


            .filter-actions .button {
                width: 100%;

                min-height: 55px;
            }


            footer {
                width: calc(100% - 24px);

                flex-direction: column;

                gap: 5px;

                font-size: 0.78rem;
            }
        }
    </style>
</head>


<body>

    <main>

        <section class="hero">

            <div class="hero-copy">

                <p class="hero-kicker">
                    Винная карта
                </p>

                <h1>
                    Найдите своё вино
                </h1>

                <p class="hero-description">
                    Выберите вино из карты или воспользуйтесь
                    фильтрами для быстрого поиска.
                </p>

            </div>

        </section>


        <div class="catalog-bar">

            <div class="wine-count">
                Найдено:
                <strong id="wineCount">
                    загрузка...
                </strong>
            </div>


            <button
                class="button button-primary"
                id="openFilters"
                type="button"
            >
                Фильтры
                <span>⌄</span>
            </button>

        </div>


        <section
            class="catalog"
            id="catalog"
        >
            <div class="state-message">
                Загружаем винную карту...
            </div>
        </section>

    </main>


    <!-- =========================================
         FILTERS
    ========================================== -->

    <div
        class="filters-overlay"
        id="filtersOverlay"
    >

        <div class="filters-panel">

            <div class="filters-header">

                <div>
                    <h2>
                        Фильтры
                    </h2>

                    <p>
                        Выберите параметры нужного вина
                    </p>
                </div>


                <button
                    class="close-button"
                    id="closeFilters"
                    type="button"
                    aria-label="Закрыть фильтры"
                >
                    ×
                </button>

            </div>


            <div class="filters-grid">

                <div class="filter-group wide">

                    <label
                        class="filter-title"
                        for="nameFilter"
                    >
                        Поиск по названию
                    </label>

                    <input
                        class="search-input"
                        id="nameFilter"
                        type="text"
                        placeholder="Введите название вина"
                    >

                </div>


                <div class="filter-group">

                    <span class="filter-title">
                        Страна
                    </span>

                    <div
                        class="chips"
                        id="countryFilters"
                    ></div>

                </div>


                <div class="filter-group">

                    <span class="filter-title">
                        Цвет
                    </span>

                    <div
                        class="chips"
                        id="colorFilters"
                    ></div>

                </div>


                <div class="filter-group">

                    <span class="filter-title">
                        Сахар
                    </span>

                    <div
                        class="chips"
                        id="sugarFilters"
                    ></div>

                </div>


                <div class="filter-group">

                    <span class="filter-title">
                        Регион
                    </span>

                    <div
                        class="chips"
                        id="regionFilters"
                    ></div>

                </div>


                <div class="filter-group">

                    <span class="filter-title">
                        Виноград
                    </span>

                    <div
                        class="chips"
                        id="grapeFilters"
                    ></div>

                </div>


                <div class="filter-group">

                    <span class="filter-title">
                        Дополнительно
                    </span>


                    <label class="checkbox-row">
                        <input
                            id="sparklingFilter"
                            type="checkbox"
                        >

                        Только игристое
                    </label>


                    <label class="checkbox-row">
                        <input
                            id="glassFilter"
                            type="checkbox"
                        >

                        Можно заказать бокал
                    </label>

                </div>

            </div>


            <div class="filter-actions">

                <button
                    class="button button-secondary"
                    id="clearFilters"
                    type="button"
                >
                    Очистить
                </button>


                <button
                    class="button button-primary"
                    id="applyFilters"
                    type="button"
                >
                    Показать вина
                </button>

            </div>

        </div>

    </div>


    <footer>

        <span>
            theSunset · development
        </span>

        <span>
            сделано с душой
            <strong>Lavroovich-ем</strong>
        </span>

    </footer>


    <script>
        const catalog =
            document.getElementById("catalog");

        const wineCount =
            document.getElementById("wineCount");


        const filtersOverlay =
            document.getElementById("filtersOverlay");

        const openFilters =
            document.getElementById("openFilters");

        const closeFilters =
            document.getElementById("closeFilters");

        const applyFilters =
            document.getElementById("applyFilters");

        const clearFilters =
            document.getElementById("clearFilters");


        const nameFilter =
            document.getElementById("nameFilter");

        const sparklingFilter =
            document.getElementById("sparklingFilter");

        const glassFilter =
            document.getElementById("glassFilter");


        const filterContainers = {
            country:
                document.getElementById("countryFilters"),

            color:
                document.getElementById("colorFilters"),

            sugar:
                document.getElementById("sugarFilters"),

            region:
                document.getElementById("regionFilters"),

            grape:
                document.getElementById("grapeFilters")
        };


        const countryMap = {
            france: "Франция",
            italy: "Италия",
            spain: "Испания",
            russia: "Россия",
            germany: "Германия",
            usa: "США",
            georgia: "Грузия",
            argentina: "Аргентина",
            portugal: "Португалия",
            australia: "Австралия",
            new_zealand: "Новая Зеландия",
            south_africa: "ЮАР",
            chile: "Чили",
            chill: "Чили",
            serbia: "Сербия",
            austria: "Австрия",
            brazil: "Бразилия"
        };


        const colorMap = {
            red: "Красное",
            white: "Белое",
            pink: "Розовое"
        };


        const sugarMap = {
            dry: "Сухое",
            semidry: "Полусухое",
            brut: "Брют",
            semisweet: "Полусладкое",
            sweet: "Сладкое"
        };


        const filterMaps = {
            country: countryMap,
            color: colorMap,
            sugar: sugarMap
        };


        let allWines = [];


        const selectedFilters = {
            country: new Set(),
            color: new Set(),
            sugar: new Set(),
            region: new Set(),
            grape: new Set()
        };


        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        function formatPrice(value) {
            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }


            return new Intl
                .NumberFormat("ru-RU")
                .format(value);
        }


        function formatWineCount(count) {
            const mod100 = count % 100;
            const mod10 = count % 10;


            if (
                mod100 >= 11 &&
                mod100 <= 14
            ) {
                return `${count} вин`;
            }


            if (mod10 === 1) {
                return `${count} вино`;
            }


            if (
                mod10 >= 2 &&
                mod10 <= 4
            ) {
                return `${count} вина`;
            }


            return `${count} вин`;
        }


        function getCountryName(value) {
            return (
                countryMap[value] ??
                value ??
                "Неизвестная страна"
            );
        }


        function getColorName(value) {
            return (
                colorMap[value] ??
                value ??
                "Другие"
            );
        }


        function getSugarName(value) {
            return (
                sugarMap[value] ??
                value ??
                "Не указано"
            );
        }


        function createWineCard(wine) {
            const sugar =
                getSugarName(wine.sugar);


            const sparklingSpec =
                wine.sparkling
                    ? `
                        <span
                            class="wine-spec wine-spec--sparkling"
                        >
                            ✦ Игристое
                        </span>
                    `
                    : "";


            const glassSpec =
                wine.price_per_bokal !== null
                    ? `
                        <span
                            class="wine-spec wine-spec--glass"
                        >
                            По бокалам
                        </span>
                    `
                    : "";


            const glassPrice =
                wine.price_per_bokal !== null
                    ? `
                        <div
                            class="price-block price-block--glass"
                        >
                            <span class="price-label">
                                Бокал
                            </span>

                            <span class="price-value">
                                ${formatPrice(
                                    wine.price_per_bokal
                                )} ₽
                            </span>
                        </div>
                    `
                    : "";


            return `
                <article class="wine-card">

                    <div class="wine-media">

                        <div
                            class="fake-bottle"
                            aria-hidden="true"
                        ></div>

                    </div>


                    <div class="wine-body">

                        <h3 class="wine-name">
                            ${escapeHtml(
                                wine.name
                            )}
                        </h3>


                        <div class="wine-specs">

                            <span class="wine-spec">
                                ${escapeHtml(
                                    sugar
                                )}
                            </span>

                            ${sparklingSpec}

                            ${glassSpec}

                        </div>


                        <div class="wine-facts">

                            <div class="wine-fact">

                                <span
                                    class="wine-fact-icon"
                                    aria-hidden="true"
                                >
                                    ●
                                </span>

                                <div class="wine-fact-content">

                                    <span class="wine-fact-label">
                                        Регион
                                    </span>

                                    <span class="wine-fact-value">
                                        ${escapeHtml(
                                            wine.region ||
                                            "Не указан"
                                        )}
                                    </span>

                                </div>

                            </div>


                            <div class="wine-fact">

                                <span
                                    class="wine-fact-icon"
                                    aria-hidden="true"
                                >
                                    ●
                                </span>

                                <div class="wine-fact-content">

                                    <span class="wine-fact-label">
                                        Виноград
                                    </span>

                                    <span class="wine-fact-value">
                                        ${escapeHtml(
                                            wine.grape ||
                                            "Не указан"
                                        )}
                                    </span>

                                </div>

                            </div>

                        </div>


                        <div class="wine-footer">

                            <div class="prices">

                                <div class="price-block">

                                    <span class="price-label">
                                        Бутылка
                                    </span>

                                    <span class="price-value">
                                        ${formatPrice(
                                            wine.price
                                        )} ₽
                                    </span>

                                </div>

                                ${glassPrice}

                            </div>


                            <a
                                class="open-card"
                                href="/wine/${wine.id}"
                                aria-label="Подробнее о ${escapeHtml(
                                    wine.name
                                )}"
                            >
                                →
                            </a>

                        </div>

                    </div>

                </article>
            `;
        }


        function groupWines(wines) {
            const groups = {};


            for (const wine of wines) {
                const country =
                    wine.country ||
                    "unknown";

                const color =
                    wine.color ||
                    "other";


                if (!groups[country]) {
                    groups[country] = {};
                }


                if (!groups[country][color]) {
                    groups[country][color] = [];
                }


                groups[country][color].push(
                    wine
                );
            }


            return groups;
        }


        function renderCatalog(wines) {
            wineCount.textContent =
                formatWineCount(
                    wines.length
                );


            applyFilters.textContent =
                `Показать ${formatWineCount(
                    wines.length
                )}`;


            if (!wines.length) {
                catalog.innerHTML = `
                    <div class="state-message">
                        Под выбранные фильтры ничего нет
                    </div>
                `;

                return;
            }


            const groups =
                groupWines(wines);


            const countries =
                Object.keys(groups)
                    .sort((a, b) => {
                        return getCountryName(a)
                            .localeCompare(
                                getCountryName(b),
                                "ru"
                            );
                    });


            let html = "";


            for (
                const country
                of countries
            ) {
                const colorGroups =
                    groups[country];


                const countryWines =
                    Object
                        .values(colorGroups)
                        .flat();


                html += `
                    <section class="country-group">

                        <div class="country-heading">

                            <h2>
                                ${escapeHtml(
                                    getCountryName(
                                        country
                                    )
                                )}
                            </h2>

                            <div
                                class="country-heading-line"
                            ></div>

                            <span class="country-count">
                                ${formatWineCount(
                                    countryWines.length
                                )}
                            </span>

                        </div>
                `;


                const colors =
                    Object.keys(colorGroups)
                        .sort((a, b) => {
                            return getColorName(a)
                                .localeCompare(
                                    getColorName(b),
                                    "ru"
                                );
                        });


                for (
                    const color
                    of colors
                ) {
                    html += `
                        <div class="color-group">

                            <div class="color-heading">
                                ${escapeHtml(
                                    getColorName(
                                        color
                                    )
                                )}
                            </div>

                            <div class="wine-grid">
                    `;


                    html +=
                        colorGroups[color]
                            .map(createWineCard)
                            .join("");


                    html += `
                            </div>

                        </div>
                    `;
                }


                html += `
                    </section>
                `;
            }


            catalog.innerHTML = html;
        }


        function getUniqueValues(field) {
            const result = [];


            for (const wine of allWines) {
                if (field === "grape") {
                    const grapes =
                        String(
                            wine.grape || ""
                        )
                            .split(",")
                            .map(
                                value =>
                                    value.trim()
                            )
                            .filter(Boolean);


                    result.push(
                        ...grapes
                    );
                } else {
                    const value =
                        wine[field];


                    if (value) {
                        result.push(
                            value
                        );
                    }
                }
            }


            return [
                ...new Set(result)
            ];
        }


        function renderFilterGroup(field) {
            const container =
                filterContainers[field];


            const map =
                filterMaps[field] || {};


            const values =
                getUniqueValues(field)
                    .sort((a, b) => {
                        const aName =
                            map[a] || a;

                        const bName =
                            map[b] || b;


                        return String(aName)
                            .localeCompare(
                                String(bName),
                                "ru"
                            );
                    });


            container.innerHTML = "";


            for (const value of values) {
                const button =
                    document.createElement(
                        "button"
                    );


                button.type = "button";
                button.className = "chip";

                button.textContent =
                    map[value] ||
                    value;


                button.addEventListener(
                    "click",
                    () => {
                        const selected =
                            selectedFilters[
                                field
                            ];


                        if (
                            selected.has(value)
                        ) {
                            selected.delete(
                                value
                            );

                            button.classList
                                .remove(
                                    "active"
                                );
                        } else {
                            selected.add(
                                value
                            );

                            button.classList
                                .add(
                                    "active"
                                );
                        }


                        applyCurrentFilters();
                    }
                );


                container.appendChild(
                    button
                );
            }
        }


        function matchesSet(
            set,
            value
        ) {
            if (!set.size) {
                return true;
            }


            return set.has(value);
        }


        function applyCurrentFilters() {
            const search =
                nameFilter.value
                    .trim()
                    .toLowerCase();


            const wines =
                allWines.filter(
                    wine => {
                        if (
                            search &&
                            !String(
                                wine.name || ""
                            )
                                .toLowerCase()
                                .includes(search)
                        ) {
                            return false;
                        }


                        if (
                            !matchesSet(
                                selectedFilters.country,
                                wine.country
                            )
                        ) {
                            return false;
                        }


                        if (
                            !matchesSet(
                                selectedFilters.color,
                                wine.color
                            )
                        ) {
                            return false;
                        }


                        if (
                            !matchesSet(
                                selectedFilters.sugar,
                                wine.sugar
                            )
                        ) {
                            return false;
                        }


                        if (
                            !matchesSet(
                                selectedFilters.region,
                                wine.region
                            )
                        ) {
                            return false;
                        }


                        if (
                            selectedFilters.grape.size
                        ) {
                            const grapes =
                                String(
                                    wine.grape || ""
                                )
                                    .split(",")
                                    .map(
                                        value =>
                                            value.trim()
                                    );


                            const matches =
                                [...selectedFilters.grape]
                                    .some(
                                        grape =>
                                            grapes.includes(
                                                grape
                                            )
                                    );


                            if (!matches) {
                                return false;
                            }
                        }


                        if (
                            sparklingFilter.checked &&
                            !wine.sparkling
                        ) {
                            return false;
                        }


                        if (
                            glassFilter.checked &&
                            wine.price_per_bokal === null
                        ) {
                            return false;
                        }


                        return true;
                    }
                );


            renderCatalog(wines);
        }


        function resetFilters() {
            nameFilter.value = "";

            sparklingFilter.checked =
                false;

            glassFilter.checked =
                false;


            for (
                const set
                of Object.values(
                    selectedFilters
                )
            ) {
                set.clear();
            }


            document
                .querySelectorAll(
                    ".chip.active"
                )
                .forEach(
                    chip =>
                        chip.classList.remove(
                            "active"
                        )
                );


            renderCatalog(
                allWines
            );
        }


        function setFilters(open) {
            filtersOverlay
                .classList
                .toggle(
                    "open",
                    open
                );


            document.body.style.overflow =
                open
                    ? "hidden"
                    : "";
        }


        async function loadWines() {
            try {
                const response =
                    await fetch(
                        "/api/wines"
                    );


                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                allWines =
                    await response.json();


                renderFilterGroup(
                    "country"
                );

                renderFilterGroup(
                    "color"
                );

                renderFilterGroup(
                    "sugar"
                );

                renderFilterGroup(
                    "region"
                );

                renderFilterGroup(
                    "grape"
                );


                renderCatalog(
                    allWines
                );

            } catch (error) {
                console.error(
                    "Не удалось загрузить вина:",
                    error
                );


                wineCount.textContent =
                    "ошибка";


                catalog.innerHTML = `
                    <div class="state-message">
                        Не удалось загрузить винную карту
                    </div>
                `;
            }
        }


        openFilters.addEventListener(
            "click",
            () => setFilters(true)
        );


        closeFilters.addEventListener(
            "click",
            () => setFilters(false)
        );


        applyFilters.addEventListener(
            "click",
            () => setFilters(false)
        );


        clearFilters.addEventListener(
            "click",
            resetFilters
        );


        nameFilter.addEventListener(
            "input",
            applyCurrentFilters
        );


        sparklingFilter.addEventListener(
            "change",
            applyCurrentFilters
        );


        glassFilter.addEventListener(
            "change",
            applyCurrentFilters
        );


        filtersOverlay.addEventListener(
            "click",
            event => {
                if (
                    event.target ===
                    filtersOverlay
                ) {
                    setFilters(false);
                }
            }
        );


        document.addEventListener(
            "keydown",
            event => {
                if (
                    event.key ===
                    "Escape"
                ) {
                    setFilters(false);
                }
            }
        );


        loadWines();
    </script>

</body>
</html>
